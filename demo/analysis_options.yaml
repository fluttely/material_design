include: package:very_good_analysis/analysis_options.yaml

formatter:
  trailing_commas: preserve
  page_width: 80
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # An app, not a library: nothing imports its API (VGA advises off for apps).
    public_member_api_docs: false
