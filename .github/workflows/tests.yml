name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)
          (cd demo && flutter pub get)

      # One script, not a list of steps that has to be kept in sync with the
      # one a human runs locally. `./tool/verify.sh` is the gate: format,
      # analyze, tests, the README↔example↔demo triad check, the
      # CHANGELOG↔pub.dev check, the example, and the demo.
      #
      # `flutter analyze` used to be commented out here while the expressive
      # module was unlinted. It is inside verify.sh now, and the tree is at
      # zero issues — keep it that way rather than disabling it again.
      - name: Verify
        run: ./tool/verify.sh
