include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # lib/src/m3e/** was excluded here until 1.6.0, so the expressive module —
    # a third of the package — was never linted. Note that `analyzer.exclude`
    # applies even to explicitly named paths, so an exclusion here makes a
    # directory invisible to `dart analyze lib/src/m3e/` too.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  trailing_commas: preserve
  page_width: 80
